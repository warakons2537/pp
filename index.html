<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WL Admin (ปพ.) · บ้านวังลึก</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/logo-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a4a26">
<meta name="apple-mobile-web-app-title" content="WL Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;700&display=swap">
<style>
/* หน้าโหลดแรก: CSS ล้วน + โลโก้ 64px ตัวเดียวกับไอคอนแท็บ (ไม่โหลดไฟล์เพิ่ม) */
html, body { margin: 0; height: 100%; background: #f6fbf6; }
.splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif; color: #404940; }
.splash img { width: 64px; height: 64px; border-radius: 16px; }
.splash b { font-size: 1.15rem; color: #0f5220; margin-top: 4px; }
.splash span { font-size: .88rem; }
.splash .bar { width: 120px; height: 4px; border-radius: 99px; background: #d2e8d2; overflow: hidden; position: relative; margin-top: 6px; }
.splash .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 99px; background: #f4be54; animation: splash-run 1.1s ease-in-out infinite; }
@keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .splash .bar::after { animation: none; width: 100%; opacity: .6; } }
@media (prefers-color-scheme: dark) {
  html, body { background: #101410; } .splash { color: #bfc9bf; } .splash b { color: #83da8c; } .splash .bar { background: #24502a; }
}
</style>
<link rel="stylesheet" href="css/app.css?v=2569.10.30-1">
<link rel="stylesheet" href="css/print.css?v=2569.10.30-1">
</head>
<body>
<div id="app"><div class="splash" role="status" aria-live="polite">
  <img src="img/logo-64.png" width="64" height="64" alt="">
  <b>WL Admin</b>
  <span>กำลังเปิดระบบ…</span>
  <i class="bar"></i>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="js/app.js?v=2569.10.30-1"></script>
</body>
</html>
